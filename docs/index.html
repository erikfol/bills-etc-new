<html lang="en">

    <title>Bills Etc</title>
    <link rel="stylesheet" href="css/app.css">
    <!-- app-version:start (written by tools/stamp_version.py) -->
    <script type="module">
        const VERSION = "20261005150648";
        const FILES = ["css/app.css", "js/app.js", "js/bills.js", "js/categories.js", "js/celledit.js", "js/charts.js", "js/csv.js", "js/data.js", "js/datatable.js", "js/dates.js", "js/electric.js", "js/equipment.js", "js/filtermenu.js", "js/finance.js", "js/fs.js", "js/heating.js", "js/history.js", "js/loans.js", "js/merchants.js", "js/ollama.js", "js/plan.js", "js/rules.js", "js/savings.js", "js/sheet.js", "js/taxes.js", "js/util.js", "js/views/bills.js", "js/views/config.js", "js/views/dashboard.js", "js/views/edit.js", "js/views/equipment.js", "js/views/heating.js", "js/views/home.js", "js/views/loans.js", "js/views/merchantrules.js", "js/views/month.js", "js/views/savings.js", "js/views/sheeteditor.js", "js/views/taxes.js", "js/views/utilcommon.js", "js/views/utilities.js", "js/views/water.js", "js/water.js", "js/workflow.js"];
        // After an update, fetch every file fresh once so new pages never run with old cached code.
        try {
            if (localStorage.getItem('billsetc-version') !== VERSION) {
                await Promise.all(FILES.map(f => fetch(f, { cache: 'reload' }).catch(() => null)));
                localStorage.setItem('billsetc-version', VERSION);
                document.querySelector('link[rel=stylesheet]').href = 'css/app.css?v=' + VERSION;
            }
        } catch { /* storage blocked: just start */ }
        await import('./js/app.js');
    </script>
    <!-- app-version:end -->
</head>

            <a href="#dashboard">Checking History</a>
            <a href="#bills">Bills</a>
            <a href="#utilities">Utilities</a>
            <a href="#loans">Loan/CC</a>
            <a href="#edit">Finance Table</a>
            <a href="#config">Config</a>
        </nav>
        <div class="status">
            <span id="st-folder" class="pill">No folder</span>
            <span id="st-ollama" class="pill" hidden></span>
        </div>
    </header>
    <main id="view"></main>
    <div id="toast"></div>
</body>
